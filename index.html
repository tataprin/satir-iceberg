<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ภูเขาน้ำแข็งในใจ 🧊</title>
<meta name="theme-color" content="#a9dcff">
<meta name="description" content="ดูละครไป ดำน้ำไป — เปิดภูเขาน้ำแข็งในใจทีละชั้น">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.scene{margin-top:6px;font-size:14px;font-weight:700;color:#e0457b}
.cue{margin:2px auto 0;font-size:13.5px;color:var(--ink-soft);font-weight:600}
.q{margin:10px 0 12px;font-size:17px;font-weight:700;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:50px;border:2px solid #fff;background:rgba(255,255,255,.72);border-radius:18px;padding:11px 14px;font-size:16px;font-weight:600;line-height:1.35;
  box-shadow:0 4px 0 rgba(60,120,190,.25);
  transition:transform .3s var(--pop),background .3s ease,border-color .3s ease,box-shadow .3s var(--pop),opacity .45s ease}
@media (hover:hover){.opt:hover:not(:disabled){transform:translateY(-2px);background:#fff;box-shadow:0 6px 0 rgba(60,120,190,.25)}}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(60,120,190,.25)}
.opt:disabled{cursor:default}
.opt.no{background:#ffe4e9;border-color:#ff9cb0;animation:wobble .55s ease-in-out}
.opt.yes{background:#d3f7e6;border-color:#3ccf92;animation:yay .55s var(--pop)}
.opt.fade{opacity:.3;transform:scale(.97)}
.oops{margin-top:8px;font-size:14px;font-weight:700;color:#d2456b;opacity:0;transform:translateY(-4px);transition:opacity .3s ease,transform .3s var(--pop)}
.oops.show{opacity:1;transform:none}
.got{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.85);font-weight:700;font-size:15px}
.aha{margin:8px 0 0;font-size:14.5px;font-weight:600;color:var(--ink-soft)}
.lockt{font-family:"Itim";font-size:20px;color:#fff;text-shadow:0 2px 6px rgba(20,60,140,.5)}
.locks{font-size:13px;color:#eaf6ff;font-weight:600;text-shadow:0 1px 4px rgba(20,60,140,.5)}
.slice.above.locked .lockt{color:var(--ink);text-shadow:none}
.slice.above.locked .locks{color:var(--ink-soft);text-shadow:none}
.slice.locked .in{opacity:.8}
.pop{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.15);z-index:6;pointer-events:none;
  animation:popup 1.3s cubic-bezier(.2,.7,.3,1) forwards}
.heart{font-size:54px;line-height:1;display:inline-block;filter:drop-shadow(0 0 14px #ffe27a);animation:beat 1.8s ease-in-out infinite}
.slice.core .opts{display:grid;grid-template-columns:1fr 1fr}
.sticker{display:inline-block;margin-top:10px;background:#fff6b8;color:#5a4500;padding:12px 18px;border-radius:6px 22px 6px 22px;font-size:18px;font-weight:700;transform:rotate(-2deg);box-shadow:0 6px 14px rgba(0,0,0,.15);animation:stick .7s var(--pop) both .2s}
.line{margin:12px 0 0;font-size:14.5px;font-weight:600}
.again{margin-top:8px;border:0;background:none;font-size:13px;font-weight:700;color:var(--ink-soft);text-decoration:underline}
.meter .cnt{margin-left:6px;padding-left:8px;border-left:2px solid rgba(29,43,83,.15)}
@keyframes wobble{0%,100%{transform:none}20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(6px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes yay{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes popup{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),-130px) scale(1.3);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes stick{from{opacity:0;transform:rotate(-10deg) scale(.6)}to{opacity:1;transform:rotate(-2deg) scale(1)}}
</style>
</head>
<body class="boot">

<button class="meter" id="meter" data-act="jump"><span class="txt">🧊 0/8</span></button>
<nav class="tabbar" data-on="game"></nav>

<header class="sky">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="title">
    <h1>ภูเขาน้ำแข็งในใจ</h1>
    <p>ละครเล่นถึงไหน ก็ตอบไปตรงนั้น แล้วน้ำแข็งจะค่อยๆ เปิด 🤿</p>
    <div class="btns">
      <button class="go" data-act="jump">🎭 เริ่มเลย! ⤵</button>
      <a class="go alt" href="info.html" data-fade>📖 แต่ละชั้นคืออะไร?</a>
      <a class="go alt" href="script.html" data-fade>🎭 บทละคร</a>
    </div>
  </div>
  <div class="col">
    <div class="peak"><div class="ice"></div><div class="snow"></div><div class="penguin">🐧</div><div class="say">ดำลงไปด้วยกันนะ!</div></div>
    <div id="top"></div>
  </div>
</header>

<main class="sea" id="sea">
  <div class="waves">
    <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q 75 0 150 20 T 300 20 T 450 20 T 600 20 T 750 20 T 900 20 T 1050 20 T 1200 20 V40 H0Z" fill="#7fd0ff"/></svg>
    <svg class="w2" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q 100 4 200 20 T 400 20 T 600 20 T 800 20 T 1000 20 T 1200 20 V40 H0Z" fill="#a8e1ff"/></svg>
  </div>
  <div class="rays"></div>
  <div id="sealife"></div>
  <div class="col" id="deep"></div>
  <div class="col tip"><div class="ice"></div></div>
  <footer class="bed">
    <span class="deco" style="left:6%">🌿</span><span class="deco" style="left:20%;top:34px;animation-delay:-1s">🐚</span>
    <span class="deco" style="right:8%;animation-delay:-2s">🪸</span><span class="deco" style="right:24%;top:36px;animation-delay:-3s">⭐</span>
    <p>💙 ถ้าใจหนักๆ คุยกับคนที่ไว้ใจได้เสมอนะ · สายด่วนสุขภาพจิต <b>1323</b></p>
    <p style="font-weight:500;font-size:12.5px">Satir Iceberg Model</p>
    <a class="pillbtn" href="info.html" data-fade>📖 แต่ละชั้นคืออะไร?</a>
    <a class="pillbtn" href="script.html" data-fade>🎭 บทละคร</a>
    <button class="pillbtn" data-act="reset">↺ เล่นใหม่</button>
  </footer>
</main>

<script src="ocean.js"></script>
<script>
const LAYERS = [
  {id:'behavior', name:'พฤติกรรม', emo:'🚶', tint:'#ffffff', wt:60, wb:72,
   scene:'ฉาก 3 · หาหมอ', cue:'“พอเรียนไม่ได้ ก็ไม่อยากอ่านหนังสือแล้ว”', q:'แล้วคนรอบตัวมองเห็นอะไรจากคนไข้?',
   opts:['ไม่อยากอ่านหนังสือ ไม่อยากทำอะไรแล้ว','อยากรู้สึกมีคุณค่า','เชื่อว่าอ่านมาก = เข้าใจมาก'], ans:0,
   aha:'อยู่บนสุด แต่เพิ่งโผล่ตอนท้าย — คนอื่นอาจเห็นแค่ “ขี้เกียจ”'},
  {id:'body', name:'ความรู้สึกทางกาย', emo:'💓', tint:'#ffe6dc', wt:72, wb:84,
   scene:'ฉาก 1 · ห้อง TBL', cue:'ตอนสอบ IRAT คนไข้นั่งนิ่งๆ ไม่คุยกับใคร', q:'ตอนนี้ร่างกายคนไข้เป็นยังไง?',
   opts:['แย่งเพื่อนพูดไม่หยุด','นิ่ง เกร็ง ถอยออกจากวง','นั่งดูบอลชิวๆ'], ans:1,
   aha:'ร่างกายรู้ก่อนเสมอ ว่าใจไม่โอเค'},
  {id:'feeling', name:'อารมณ์ความรู้สึก', emo:'🌧️', tint:'#ffdcea', wt:84, wb:92,
   scene:'ฉาก 0 · ก่อนเรียน', cue:'ตอนเพื่อนชวนกดแรงค์ · “เครียดจะตายอยู่แล้ว”', q:'ตอนนี้คนไข้รู้สึกยังไง?',
   opts:['ชิว สบายๆ','ตื่นเต้น ดีใจ','ท้อ เหนื่อย เครียด'], ans:2,
   aha:'ความเครียดสะสมทั้งสัปดาห์ จนระเบิดใส่เพื่อน'},
  {id:'faf', name:'ความรู้สึกต่อความรู้สึก', emo:'🪞', tint:'#ece0ff', wt:92, wb:97,
   scene:'ฉาก 3 · หาหมอ', cue:'“รู้สึกละอายใจครับ ว่าเราเป็นแบบนี้ก็เพราะตัวเอง”', q:'เขารู้สึกยังไง กับการที่ตัวเองท้อ?',
   opts:['ละอายใจ โทษตัวเอง','ภูมิใจในตัวเอง','ไม่รู้สึกอะไรเลย'], ans:0,
   aha:'เจ็บแล้วยังโทษตัวเองที่เจ็บ = หนักเป็นสองเท่า'},
  {id:'perception', name:'ความคิด / ความเชื่อ', emo:'💭', tint:'#dde7ff', wt:97, wb:98,
   scene:'ฉาก 2 · บ้าน', cue:'ตอนคุยกับแม่ · “แล้วผมล่ะแม่!”', q:'คนไข้กำลังบอกตัวเองว่าอะไร?',
   opts:['“เดี๋ยวก็ผ่านไป”','“อ่านเท่าไหร่ ก็คงไม่เข้าใจเหมือนเพื่อน”','“เพื่อนก็ไม่ได้เก่งกว่าเรา”'], ans:1,
   aha:'เอาตัวเองไปเทียบกับทุกคน จนเชื่อว่าสู้ไม่ได้'},
  {id:'expectation', name:'ความคาดหวัง', emo:'🎯', tint:'#d6f6ea', wt:98, wb:93,
   scene:'ฉาก 1 · หลังเลิกคาบ', cue:'เดินกลับบ้าน · “อ่านละเอียดจัดๆ ทำไมยังไม่ได้อีก”', q:'“สมการลับ” ในใจคนไข้คือ?',
   opts:['นอนเยอะ = ฉลาด','อ่านมาก = เข้าใจมาก','เล่นเกม = เก่ง'], ans:1,
   aha:'สมการที่เคยได้ผลตอนมัธยม ใช้ไม่ได้ในโลกใหม่'},
  {id:'yearning', name:'ความปรารถนา', emo:'💗', tint:'#ffdff1', wt:93, wb:82,
   scene:'ฉาก 3 · หาหมอ', cue:'“ผมผูกคุณค่าไว้กับการเรียน”', q:'ลึกๆ หัวใจเขาต้องการอะไร?',
   opts:['อยากเรียนได้ A อย่างเดียว','อยากรู้สึกมีคุณค่า และได้รับการยอมรับ','อยากให้เพื่อนทำไม่ได้บ้าง'], ans:1,
   aha:'สิ่งที่ทุกคนต้องการ และบริสุทธิ์มากๆ'},
  {id:'self', name:'ตัวตน', emo:'✨', tint:'#fff1b8', wt:82, wb:70, core:true,
   scene:'ตอนจบ', cue:'“ผมคิดว่าผมสามารถไปต่อได้แล้วครับ!!!”', q:'ก่อนกลับบ้าน… อยากบอกอะไรกับตัวเอง?',
   opts:['เหนื่อยได้ พักได้นะ 🌙','เราเก่งในแบบของเรา 🌱','ใจดีกับตัวเองหน่อยนะ 🫶','ไม่ต้องสู้คนเดียวก็ได้ 🤝']}
];
// questions follow the play, not the iceberg's depth
const ORDER = ['feeling','body','expectation','perception','behavior','faf','yearning','self'];
const byId = Object.fromEntries(LAYERS.map(l => [l.id, l]));

/* state */
const KEY = 'iceberg-v2';
let S = {solved:{}, self:null};
try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const isDone = l => l.core ? S.self !== null : !!S.solved[l.id];
const activeId = () => ORDER.find(id => !isDone(byId[id]));
const $ = id => document.getElementById(id);

LAYERS.forEach((l, k) => $(k === 0 ? 'top' : 'deep').appendChild(makeSlice(l, k, l.core ? ' core' : '')));

function inner(l, k){
  const n = k + 1;
  if(isDone(l)){
    if(l.core) return `<div class="heart">💛</div>
      <h2 class="name">${l.emo} ${l.name} ${l.emo}</h2>
      <div class="sticker">ถึงตัวฉัน: ${l.opts[S.self]}</div>
      <p class="line">“ผมคิดว่าผมสามารถไปต่อได้แล้วครับ!!!” 🚀🕊️</p>
      <a class="go" style="margin-top:14px" href="me.html" data-fade>🧊 ลองดูภูเขาน้ำแข็งของตัวเอง →</a>
      <br><button class="again" data-act="reself">เปลี่ยนข้อความ</button>`;
    return `<span class="tag">ชั้น ${n}${k === 0 ? ' · เหนือน้ำ' : ''}</span>
      <h2 class="name"><span class="e">${l.emo}</span> ${l.name}</h2>
      <div class="got">✓ ${l.opts[l.ans]}</div>
      <p class="aha">${l.aha}</p>`;
  }
  if(l.id !== activeId()){
    return `<div class="lockt">❄️ ${l.core ? 'แก่นกลาง' : 'ชั้น ' + n} ❄️</div><div class="locks">🔒 จะเปิดตอน ${l.scene}</div>`;
  }
  const opts = l.opts.map((o, i) => `<button class="opt" data-act="pick" data-i="${i}">${o}</button>`).join('');
  return `<span class="tag">คำถาม ${ORDER.indexOf(l.id) + 1}/8 · ${l.core ? 'แก่นกลาง' : 'ชั้น ' + n}</span>
    ${l.core ? '<div class="heart" style="margin-top:8px">🤍</div>' : ''}
    <h2 class="name"><span class="e">${l.emo}</span> ${l.name}</h2>
    <div class="scene">🎭 ${l.scene}</div>
    <div class="cue">${l.cue}</div>
    <p class="q">${l.q}</p>
    <div class="opts">${opts}</div>
    <div class="oops">ยังไม่ใช่น้า ลองอีกที 🫧</div>`;
}

const shown = {};   // last rendered state per slice, so only changed slices animate
const stateOf = l => isDone(l) ? 'solved' + (l.core ? S.self : '') : (l.id === activeId() ? 'active' : 'locked');

function render(animate){
  LAYERS.forEach((l, k) => {
    const st = stateOf(l);
    if(shown[l.id] === st) return;
    shown[l.id] = st;
    const el = $('L-' + l.id);
    const apply = () => {
      el.classList.toggle('solved', st.startsWith('solved'));
      el.classList.toggle('active', st === 'active');
      el.classList.toggle('locked', st === 'locked');
      el.querySelector('.in').innerHTML = inner(l, k);
    };
    animate && !REDUCE ? morph(el, apply) : apply();
  });
  const act = activeId(), n = LAYERS.filter(isDone).length;
  const html = act ? `🎭 ${byId[act].scene} <span class="cnt">🧊 ${n}/8</span> ⤵` : '🧊 ครบแล้ว! 💛';
  const txt = $('meter').querySelector('.txt');
  if(txt.innerHTML !== html){
    txt.innerHTML = html;
    if(animate){ txt.classList.remove('swap'); void txt.offsetWidth; txt.classList.add('swap'); }
  }
}

function burst(el, from){
  const r = el.getBoundingClientRect(), b = from.getBoundingClientRect();
  for(let i = 0; i < 14; i++){
    const p = document.createElement('span'); p.className = 'pop';
    const s = 6 + Math.random() * 14;
    p.style.cssText = `left:${b.left - r.left + Math.random() * b.width}px;top:${b.top - r.top + b.height / 2}px;width:${s}px;height:${s}px;--dx:${(Math.random() - .5) * 80}px;animation-delay:${Math.random() * .25}s`;
    el.appendChild(p);
    setTimeout(() => p.remove(), 1800);
  }
}
function bump(){ const m = $('meter'); m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump'); }
const jump = () => { const a = activeId(); glide($('L-' + (a || 'self'))); };

let busy = false;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act === 'jump') return jump();
  if(act === 'pick'){
    if(busy) return;
    const l = byId[activeId()], i = +b.dataset.i, el = $('L-' + l.id);
    if(!l.core && i !== l.ans){
      b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
      el.querySelector('.oops').classList.add('show');
      buzz([30, 40, 30]);
      return;
    }
    busy = true; buzz(20);
    b.classList.add('yes');
    el.querySelectorAll('.opt').forEach(o => { o.disabled = true; if(o !== b) o.classList.add('fade'); });
    burst(el, b); shine(el);
    setTimeout(() => {
      if(l.core) S.self = i; else S.solved[l.id] = true;
      save(); render(true); bump();
      const nx = activeId() && $('L-' + activeId());
      if(nx) setTimeout(() => shine(nx), 500);
      setTimeout(() => { if(nx) glide(nx); busy = false; }, 1050);
    }, 750);
  }
  if(act === 'reself'){ S.self = null; save(); render(true); }
  if(act === 'reset'){
    S = {solved:{}, self:null}; save(); render(true);
    setTimeout(() => glide(document.body), 300);
  }
});

sealife($('sealife'));
render(false);
setTimeout(() => document.body.classList.remove('boot'), 2000);
</script>
</body>
</html>
