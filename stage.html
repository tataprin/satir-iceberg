<style>
/* one screen, no scrolling. Each scene shows its room first; the iceberg comes in when a layer is revealed.
   --wl is the waterline (bottom of the first layer); the "tank" is the iceberg's own window of sea */
:root{--top:4vh;--pk:10vh;--lh:9.2vh;--tip:5vh;--bw:min(50vw,98vh);--wl:calc(var(--top) + var(--pk) + var(--lh));
  --tt:2vh;--tb:2vh;--tw:calc(var(--bw) + 3vw);--tx:calc((100vw - var(--tw)) / 2)}
@media (max-aspect-ratio:1/1){
  :root{--top:12vh;--pk:7vh;--lh:8.4vh;--tip:4vh;--bw:88vw;--tt:7vh;--tb:4vh;--tw:94vw;--tx:3vw}
}
html,body{height:100%;overflow:hidden}
body{cursor:pointer;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#a9dcff 0,#e3f5ff var(--wl),#7fd0ff var(--wl),#46a6ea calc(var(--wl) + 18vh),#2477cc 70%,#0d2a66 100%)}
.sun{left:auto;right:4vw;top:3vh}
.seawrap{position:absolute;left:0;right:0;top:var(--wl);bottom:0;pointer-events:none}
.seawrap .rays{height:100%}
.seawrap .waves{z-index:1}

/* title (first slide only) */
.cover{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;
  transition:opacity .8s ease,transform 1s var(--pop)}
body:not(.cover-on) .cover{opacity:0;transform:translateY(-4vh) scale(.96)}
.cover .pg{font-size:clamp(48px,12vh,140px);line-height:1;animation:float 3s ease-in-out infinite}
.cover h1{margin:.1em 0 0;padding:0 4vw;font-size:clamp(32px,min(12vh,11vw),150px);line-height:1.15;color:var(--ink);
  text-shadow:0 .05em 0 #fff,.04em 0 0 #fff,-.04em 0 0 #fff,0 -.04em 0 #fff,0 .1em .3em rgba(0,40,100,.25)}
.cover p{margin:.6em 0 0;padding:.25em 1em;border-radius:99px;background:rgba(255,255,255,.85);font-size:clamp(14px,2.6vh,30px);font-weight:700;color:var(--ink-soft)}

/* room photos behind the play's scenes (title + finale stay in the open sea) */
.rooms{position:absolute;inset:0;z-index:1;pointer-events:none}
.rooms div{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transform:scale(1.06);transition:opacity 1.1s ease,transform 7s ease-out}
.rooms div.on{opacity:1;transform:none}
.rooms::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .9s ease;background:rgba(8,12,26,.35)}
body.room:not(.hide) .rooms::after{opacity:1}

.tank{position:absolute;z-index:2;top:var(--tt);bottom:var(--tb);right:var(--tx);width:var(--tw);overflow:hidden;border-radius:0;
  transition:top .9s var(--ease),bottom .9s var(--ease),right .9s var(--ease),width .9s var(--ease),border-radius .9s var(--ease),box-shadow .9s ease,
    opacity .7s ease,transform .9s var(--pop)}
body.hide .tank{opacity:0;transform:translateY(6vh) scale(.9)}
.tank::before,.tank::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .9s ease}
.tank::before{background:linear-gradient(180deg,#a9dcff 0,#e3f5ff calc(var(--wl) - var(--tt)),#7fd0ff calc(var(--wl) - var(--tt)),
  #46a6ea calc(var(--wl) - var(--tt) + 18vh),#2477cc calc(70vh - var(--tt)),#0d2a66 calc(100vh - var(--tt)))}
.tank::after{z-index:4;box-shadow:inset 0 0 0 clamp(3px,.6vh,6px) rgba(255,255,255,.85)}
.tlife{position:absolute;left:0;right:0;top:calc(var(--wl) - var(--tt));bottom:0;opacity:0;transition:opacity .9s ease}
.tlife .waves{z-index:1}
#tanklife{position:absolute;inset:0;overflow:hidden}
body.room .tank{border-radius:clamp(18px,3vh,34px);box-shadow:0 22px 70px rgba(0,0,0,.55)}
body.room .tank::before,body.room .tank::after,body.room .tlife{opacity:1}
/* landscape rooms: a smaller iceberg, so the room shows around it */
@media (min-aspect-ratio:1/1){
  body.room .tank{--top:11vh;--pk:8vh;--lh:7.6vh;--tip:4vh;--bw:min(40vw,80vh);--tt:8vh;--tb:12vh;
    --tw:calc(var(--bw) + 3vw);--tx:calc((100vw - var(--tw)) / 2);--wl:calc(var(--top) + var(--pk) + var(--lh))}
}

.berg{position:absolute;z-index:2;top:calc(var(--top) - var(--tt));left:calc((var(--tw) - var(--bw)) / 2);width:var(--bw);
  transition:top .9s var(--ease),left .9s var(--ease),width .9s var(--ease)}
.berg .peak{height:var(--pk);margin:0;transition:height .9s var(--ease)}
.berg .penguin{top:calc(var(--pk) * -.32);font-size:clamp(26px,5vh,54px)}
.berg .say{display:none}
.berg .sea{background:none}
.berg .slice .ice,.berg .slice.solved .ice{height:var(--lh);min-height:0;padding:0}
.berg .tip{position:relative;height:var(--tip);transition:height .9s var(--ease)}
.berg .in{line-height:1.25}
.sn{font-family:"Itim";font-size:clamp(14px,2.9vh,36px)}
.sn .e{display:inline-block;animation:wiggle 3.4s ease-in-out infinite}
.sa{margin-top:.15em;font-size:clamp(11px,2.1vh,26px);font-weight:700;color:var(--ink-soft)}
.berg .lockt{font-size:clamp(13px,2.2vh,24px)}
.berg .slice.above .lockt{color:var(--ink);text-shadow:none}
.berg .slice.core.solved .sn{color:#5a4500}
.berg .slice.core.solved .sa{color:#7a5a10}
.pop{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.15);z-index:6;pointer-events:none;
  animation:popup 1.3s cubic-bezier(.2,.7,.3,1) forwards}
/* phones: size text by width too, so long answers stay on one line */
@media (max-aspect-ratio:1/1){
  .sn{font-size:min(2.6vh,4.4vw)}
  .sa{font-size:min(1.9vh,3.3vw)}
  .berg .lockt{font-size:min(2.2vh,4vw)}
}

/* finale: every layer glows */
body.finale .berg .slice .glow{opacity:1;animation:breathe 3.2s ease-in-out infinite}
body.finale .berg .slice.core .ice{box-shadow:0 0 40px 10px rgba(255,226,122,.8)}

/* controls (fade away when the mouse rests) */
.ctl{position:fixed;z-index:8;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;cursor:default;
  transition:opacity .6s ease}
.dots{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:7px;pointer-events:none;transition:opacity .6s ease}
body.idle .ctl,body.idle .dots{opacity:0}
body.idle{cursor:none}
.ctl button{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.75);font-size:20px;font-weight:700;color:var(--ink)}
.ctl button:active{transform:scale(.92)}
.dots i{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.45);transition:width .4s var(--pop),background .3s}
.dots i.on{width:26px;background:#fff}
@media (max-aspect-ratio:1/1){ .dots{left:16px;transform:none} }
@keyframes popup{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),-130px) scale(1.3);opacity:0}}
</style>
</head>
<body class="boot hide cover-on">

<div class="sun"></div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="seawrap">
  <div class="waves">
    <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q 75 0 150 20 T 300 20 T 450 20 T 600 20 T 750 20 T 900 20 T 1050 20 T 1200 20 V40 H0Z" fill="#7fd0ff"/></svg>
    <svg class="w2" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q 100 4 200 20 T 400 20 T 600 20 T 800 20 T 1000 20 T 1200 20 V40 H0Z" fill="#a8e1ff"/></svg>
  </div>
  <div class="rays"></div>
  <div id="sealife"></div>
</div>

<div class="cover">
  <div class="pg">🐧</div>
  <h1>ภูเขาน้ำแข็งในใจ</h1>
  <p>🧊 Satir Iceberg Model</p>
</div>

<div class="rooms" id="rooms"></div>

<div class="tank">
<div class="tlife">
  <div class="waves">
    <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q 75 0 150 20 T 300 20 T 450 20 T 600 20 T 750 20 T 900 20 T 1050 20 T 1200 20 V40 H0Z" fill="#7fd0ff"/></svg>
    <svg class="w2" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q 100 4 200 20 T 400 20 T 600 20 T 800 20 T 1000 20 T 1200 20 V40 H0Z" fill="#a8e1ff"/></svg>
  </div>
  <div id="tanklife"></div>
</div>
<div class="berg" id="berg">
  <div class="peak"><div class="ice"></div><div class="snow"></div><div class="penguin">🐧</div></div>
  <div id="top"></div>
  <div class="sea" id="deep"></div>
  <div class="tip"><div class="ice"></div></div>
</div>
</div>

<div class="dots" id="dots"></div>
<div class="ctl">
  <button data-c="back" aria-label="ย้อนกลับ">‹</button>
  <button data-c="next" aria-label="ถัดไป">›</button>
  <button data-c="full" aria-label="เต็มจอ">⛶</button>
</div>

<script src="ocean.js?v=7"></script>
<script>
const LAYERS = [
  {id:'behavior', name:'พฤติกรรม', emo:'🚶', tint:'#ffffff', wt:60, wb:72, ans:'ไม่อยากอ่านหนังสือแล้ว'},
  {id:'body', name:'ความรู้สึกทางกาย', emo:'💓', tint:'#ffe6dc', wt:72, wb:84, ans:'นิ่ง เกร็ง ถอยออกจากวง'},
  {id:'feeling', name:'อารมณ์ความรู้สึก', emo:'🌧️', tint:'#ffdcea', wt:84, wb:92, ans:'ท้อ เหนื่อย เครียด'},
  {id:'faf', name:'ความรู้สึกต่อความรู้สึก', emo:'🪞', tint:'#ece0ff', wt:92, wb:97, ans:'ละอายใจ โทษตัวเอง'},
  {id:'perception', name:'ความคิด / ความเชื่อ', emo:'💭', tint:'#dde7ff', wt:97, wb:98, ans:'“อ่านเท่าไหร่ ก็คงไม่เข้าใจเหมือนเพื่อน”'},
  {id:'expectation', name:'ความคาดหวัง', emo:'🎯', tint:'#d6f6ea', wt:98, wb:93, ans:'อ่านมาก = เข้าใจมาก'},
  {id:'yearning', name:'ความปรารถนา', emo:'💗', tint:'#ffdff1', wt:93, wb:82, ans:'อยากรู้สึกมีคุณค่า และได้รับการยอมรับ'},
  {id:'self', name:'ตัวตน', emo:'✨', tint:'#fff1b8', wt:82, wb:70, core:true, ans:'ฉันมีคุณค่า ในแบบของฉัน 💛'}
];
// each scene: first just the room, then one click per layer it reveals
const SCENES = [
  {cover:true, reveal:[]},
  {bg:'corridor', reveal:['feeling']},                   // ฉาก 0 · เตรียมตัวก่อนเข้าเรียน TBL
  {bg:'classroom', reveal:['body','expectation']},       // ฉาก 1 · ห้องเรียน TBL
  {bg:'home', reveal:['perception']},                    // ฉาก 2 · บ้าน
  {bg:'doctor', reveal:['behavior','faf','yearning']},   // ฉาก 3 · หาหมอ
  {bg:'doctor', reveal:['self']},                        // ตอนจบ
  {finale:true, reveal:[]}                               // ภูเขาน้ำแข็งเต็มลูก
];
const STEPS = SCENES.flatMap((sc, s) => [{s, n:0}, ...sc.reveal.map((_, j) => ({s, n:j + 1}))]);
const $ = id => document.getElementById(id);

LAYERS.forEach((l, k) => $(k === 0 ? 'top' : 'deep').appendChild(makeSlice(l, k, l.core ? ' core' : '')));
$('dots').innerHTML = SCENES.map(() => '<i></i>').join('');
const ROOMS = [...new Set(SCENES.map(sc => sc.bg).filter(Boolean))];
$('rooms').innerHTML = ROOMS.map(r => `<div data-r="${r}" style="background-image:url(bg/${r}.webp)"></div>`).join('');

const opened = st => {
  const {s, n} = STEPS[st];
  return new Set(SCENES.slice(0, s).flatMap(sc => sc.reveal).concat(SCENES[s].reveal.slice(0, n)));
};
const nextUp = st => { const nx = STEPS[st + 1]; return nx && nx.n ? SCENES[nx.s].reveal[nx.n - 1] : null; };

function slideHTML(l, k, isOpen){
  if(isOpen) return `<div class="sn"><span class="e">${l.emo}</span> ${l.name}${l.core ? ' ' + l.emo : ''}</div><div class="sa">${l.ans}</div>`;
  return `<div class="lockt">❄️ ${l.core ? 'แก่นกลาง' : 'ชั้น ' + (k + 1)} ❄️</div>`;
}

function burst(el){
  const r = el.getBoundingClientRect();
  for(let i = 0; i < 16; i++){
    const p = document.createElement('span'); p.className = 'pop';
    const s = 6 + Math.random() * 16;
    p.style.cssText = `left:${r.width * (.25 + Math.random() * .5)}px;top:${r.height * .6}px;width:${s}px;height:${s}px;--dx:${(Math.random() - .5) * 90}px;animation-delay:${Math.random() * .25}s`;
    el.appendChild(p);
    setTimeout(() => p.remove(), 1800);
  }
}

// bring every layer in line with the current step; a layer opening for the first time shines and bubbles
function syncLayers(animate){
  const now = opened(at), up = nextUp(at);
  LAYERS.forEach((l, k) => {
    const el = $('L-' + l.id), isOpen = now.has(l.id), html = slideHTML(l, k, isOpen), inn = el.querySelector('.in');
    const wasOpen = el.classList.contains('solved');
    const apply = () => {
      el.classList.toggle('solved', isOpen);
      el.classList.toggle('active', up === l.id);
      el.classList.toggle('locked', !isOpen && up !== l.id);
      inn.innerHTML = html;
    };
    if(wasOpen === isOpen || !animate || REDUCE) return apply();
    morph(el, apply);
    if(isOpen){ shine(el); burst(el); }
  });
}

let at = -1, syncT = 0;
function go(st, animate){
  st = Math.max(0, Math.min(STEPS.length - 1, st));
  if(st === at) return;
  at = st;
  history.replaceState(null, '', '#' + st);
  const {s, n} = STEPS[st], sc = SCENES[s], b = document.body;
  const show = !!sc.finale || n > 0, appearing = show && b.classList.contains('hide');
  b.classList.toggle('cover-on', !!sc.cover);
  b.classList.toggle('finale', !!sc.finale);
  b.classList.toggle('room', !!sc.bg);
  b.classList.toggle('hide', !show);
  [...$('rooms').children].forEach(d => d.classList.toggle('on', d.dataset.r === sc.bg));
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === s));
  // when the iceberg is just coming in, let it land before the layer opens
  clearTimeout(syncT);
  if(appearing && animate && !REDUCE) syncT = setTimeout(() => syncLayers(true), 750);
  else syncLayers(animate && show);
}
const next = () => go(at + 1, true), back = () => go(at - 1, true);

function toggleFull(){
  const d = document;
  if(d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const e = d.documentElement; (e.requestFullscreen || e.webkitRequestFullscreen || (() => {})).call(e); }
}

// click anywhere = next (a presenter can also use a clicker / arrow keys)
document.addEventListener('click', e => {
  const c = e.target.closest('[data-c]');
  if(c){ ({back, next, full:toggleFull})[c.dataset.c](); return; }
  next();
});
addEventListener('keydown', e => {
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); back(); }
  else if(e.key === 'Home') go(0, true);
  else if(e.key === 'End') go(STEPS.length - 1, true);
  else if(e.key === 'f' || e.key === 'F') toggleFull();
});
// swipe on phones
let sx = null;
addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
addEventListener('touchend', e => {
  if(sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 50){ dx < 0 ? next() : back(); }
}, {passive:true});
// hide the controls and cursor when the mouse rests (for the projector)
let idleT = 0;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); };
addEventListener('mousemove', wake); wake();

sealife($('sealife')); sealife($('tanklife'));
go(parseInt(location.hash.slice(1)) || 0, false);
setTimeout(() => document.body.classList.remove('boot'), 2000);
</script>
</body>
</html>
